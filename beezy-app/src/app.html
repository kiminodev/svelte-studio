<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#ffd21e" />
		<script>
			(function () {
				try {
					var t = localStorage.getItem('beezy.theme.v1');
					if (t !== 'pink' && t !== 'yellow' && t !== 'blue' && t !== 'purple') return;
					document.documentElement.setAttribute('data-theme', t);
					var accents = {
						pink: '#f4b8cc',
						yellow: '#ffd21e',
						blue: '#b5d4ea',
						purple: '#d2c4ea'
					};
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', accents[t]);
				} catch (e) {}
			})();
		</script>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Beezy" />
		<meta name="text-scale" content="scale" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
